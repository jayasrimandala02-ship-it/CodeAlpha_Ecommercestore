
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELOURA | My Account</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #fff9f7; color: #392a2e; }
        header { background: #f4dfe3; padding: 20px 6%; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo { color: #a34f6d; letter-spacing: 4px; margin: 0; }
        nav { display: flex; flex-wrap: wrap; gap: 15px; }
        nav a, .link { color: #a34f6d; text-decoration: none; }
        main { max-width: 850px; margin: 40px auto; padding: 20px; }
        .card { background: white; padding: 28px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 5px 20px #6e394510; }
        .button { display: inline-block; padding: 12px 18px; background: #a34f6d; color: white; text-decoration: none; border-radius: 8px; margin: 5px 5px 5px 0; }
        .detail { padding: 12px 0; border-bottom: 1px solid #f1e3e7; overflow-wrap: anywhere; }
    </style>
</head>
<body>
<header>
    <h1 class="logo">VELOURA</h1>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'products' %}">Products</a>
        <a href="{% url 'cart' %}">My Cart</a>
        <a href="{% url 'my_orders' %}">My Orders</a>
        <a href="{% url 'logout' %}">Logout</a>
    </nav>
</header>

<main>
    <h2>My Account</h2>
    <p>Manage your VELOURA shopping account.</p>

    <section class="card">
        <h3>Personal Information</h3>
        <div class="detail"><strong>Name:</strong> {{ user.full_name }}</div>
        <div class="detail"><strong>Email:</strong> {{ user.email }}</div>
    </section>

    <section class="card">
        <h3>My Shopping</h3>
        <a class="button" href="{% url 'my_orders' %}">My Orders</a>
        <a class="button" href="{% url 'cart' %}">View Cart</a>
        <a class="button" href="{% url 'products' %}">Explore Products</a>
    </section>
</main>
</body>
</html>
