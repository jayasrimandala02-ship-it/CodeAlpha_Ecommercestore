
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELOURA | Checkout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            background: #fff8f7;
            color: #392a2e;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            margin-bottom: 22px;
            border-radius: 18px;
            box-shadow: 0 6px 24px rgba(80, 40, 50, 0.07);
        }

        h1, h2 {
            color: #a34f6d;
            margin-top: 0;
        }

        h1 {
            text-align: center;
            letter-spacing: 3px;
        }

        label {
            display: block;
            margin: 20px 0 10px;
            font-weight: bold;
            font-size: 17px;
        }

        input, textarea {
            display: block;
            width: 100%;
            padding: 15px;
            border: 1px solid #e8b9c8;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            color: #392a2e;
            background: white;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: 2px solid #e8b9c8;
            border-color: #a34f6d;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            margin-top: 12px;
            border: 1px solid #e8b9c8;
            border-radius: 12px;
            cursor: pointer;
        }

        .payment-option input {
            width: auto;
            accent-color: #a34f6d;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        .button {
            display: block;
            width: 100%;
            margin-top: 24px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #a34f6d;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #873d59;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #a34f6d;
            text-decoration: none;
        }

        .message {
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 10px;
            background: #fff0f2;
            color: #8a304b;
        }

        .empty {
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <a class="back-link" href="{% url 'cart' %}">
        &larr; Back to Cart
    </a>

    <h1>VELOURA</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'checkout' %}">
        {% csrf_token %}

        <div class="card">
            <h2>Delivery Details</h2>

            <label for="full_name">Full Name</label>
            <input
                type="text"
                id="full_name"
                name="full_name"
                value="{{ full_name }}"
                placeholder="Enter your full name"
                required
            >

            <label for="address">Full Delivery Address</label>
            <textarea
                id="address"
                name="address"
                placeholder="House number, street, city, state, PIN code"
                required
            ></textarea>

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter 10-digit mobile number"
                inputmode="numeric"
                pattern="[0-9]{10}"
                maxlength="10"
                minlength="10"
                required
            >
        </div>

<div class="card">
    <h2>Payment Method</h2>

    <label class="payment-option">
        <input type="radio" name="payment_method" value="UPI" required>
        <span>
            <strong>UPI</strong><br>
            <small>Currently unavailable. Please choose COD.</small>
        </span>
    </label>

    <label class="payment-option">
        <input type="radio" name="payment_method" value="COD" checked required>
        <span>
            <strong>Cash on Delivery (COD)</strong><br>
            <small>Pay when your order arrives.</small>
        </span>
    </label>

    <div class="total">
        Order Total: ₹{{ total }}
    </div>

    <button class="button" type="submit">Place Order</button>
</div>
    </form>

</div>
</body>
</html>
